{% extends "admin_base.html" %}{% block content %}<h1>Students</h1><div class="card"><table><tr><th>Name</th><th>Student ID</th><th>Email</th><th>Attempts</th><th></th></tr>
{% for r in rows %}<tr><td>{{ r.name }}</td><td>{{ r.student_id }}</td><td>{{ r.email }}</td><td>{{ r.n }}</td><td><form method="post" action="{{ url_for('admin_reset', uid=r.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="btn sm ghost">Reset password</button></form></td></tr>{% else %}<tr><td colspan="5">No students registered yet.</td></tr>{% endfor %}</table></div>{% endblock %}
